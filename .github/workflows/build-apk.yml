name: Bina PB-Repot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v5

      - name: Sediakan Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -f cmdline-tools.zip
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          chmod -R +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          (printf 'y\n%.0s' {1..50}) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Jana Keystore Tandatangan APK PB-Repot
        run: |
          set -e
          KEYSTORE_PASS="${{ secrets.PBREPOT_KEYSTORE_PASSWORD || 'pbrepot123' }}"
          if [ -n "${{ secrets.PBREPOT_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PBREPOT_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/pbrepot-android.keystore"
          else
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/pbrepot-android.keystore" -alias pbrepotkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=PB-Repot, OU=Polis Bantuan, O=PB-Repot, L=Melaka, ST=Melaka, C=MY"
          fi
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - name: Bina Projek Android & APK PB-Repot
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/pbrepot-project/app/src/main/java/org/pbrepot/app" "$GITHUB_WORKSPACE/pbrepot-project/app/src/main/res/values"
          cd "$GITHUB_WORKSPACE/pbrepot-project"
          export ANDROID_HOME="$HOME/android-sdk"
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          printf "rootProject.name = 'PBRepotApp'\ninclude ':app'\n" > settings.gradle
          printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.1.4'\n    }\n}\n\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle
          printf "plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace 'org.pbrepot.app'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId \"org.pbrepot.app\"\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0.0\"\n    }\n\n    signingConfigs {\n        release {\n            storeFile file(\"%s/pbrepot-android.keystore\")\n            storePassword \"%s\"\n            keyAlias \"pbrepotkey\"\n            keyPassword \"%s\"\n        }\n    }\n\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false\n        }\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n" "$GITHUB_WORKSPACE" "$KEYSTORE_PASS" "$KEYSTORE_PASS" > app/build.gradle
          printf "<resources>\n    <string name=\"app_name\">PB-Repot</string>\n</resources>\n" > app/src/main/res/values/strings.xml

          node -e '
            const fs = require("fs");
            const path = require("path");
            const zlib = require("zlib");

            function crc32(buf) {
              let c = 0xffffffff;
              for (let i = 0; i < buf.length; i++) {
                c ^= buf[i];
                for (let k = 0; k < 8; k++) {
                  c = (c >>> 1) ^ (c & 1 ? 0xedb88320 : 0);
                }
              }
              return (c ^ 0xffffffff) >>> 0;
            }

            function chunk(type, data) {
              const len = Buffer.alloc(4);
              len.writeUInt32BE(data.length, 0);
              const typeBuf = Buffer.from(type, "ascii");
              const crcBuf = Buffer.alloc(4);
              crcBuf.writeUInt32BE(crc32(Buffer.concat([typeBuf, data])), 0);
              return Buffer.concat([len, typeBuf, data, crcBuf]);
            }

            function makePBRepotPng(size) {
              const raw = Buffer.alloc(size * (1 + size * 4));
              for (let y = 0; y < size; y++) {
                const rowStart = y * (1 + size * 4);
                raw[rowStart] = 0;
                for (let x = 0; x < size; x++) {
                  const px = rowStart + 1 + x * 4;
                  const nx = x / size;
                  const ny = y / size;
                  const inPad = nx >= 0.14 && nx <= 0.86 && ny >= 0.14 && ny <= 0.86;
                  const inLine1 = inPad && nx >= 0.26 && nx <= 0.74 && ny >= 0.28 && ny <= 0.38;
                  const inLine2 = inPad && nx >= 0.26 && nx <= 0.64 && ny >= 0.45 && ny <= 0.55;
                  const inLine3 = inPad && nx >= 0.26 && nx <= 0.74 && ny >= 0.62 && ny <= 0.72;
                  if (inLine1 || inLine2 || inLine3) {
                    raw[px] = 255;
                    raw[px + 1] = 255;
                    raw[px + 2] = 255;
                    raw[px + 3] = 255;
                  } else {
                    raw[px] = 0;
                    raw[px + 1] = 31;
                    raw[px + 2] = 63;
                    raw[px + 3] = 255;
                  }
                }
              }
              const ihdr = Buffer.alloc(13);
              ihdr.writeUInt32BE(size, 0);
              ihdr.writeUInt32BE(size, 4);
              ihdr[8] = 8;
              ihdr[9] = 6;
              ihdr[10] = 0;
              ihdr[11] = 0;
              ihdr[12] = 0;
              return Buffer.concat([
                Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
                chunk("IHDR", ihdr),
                chunk("IDAT", zlib.deflateSync(raw)),
                chunk("IEND", Buffer.alloc(0))
              ]);
            }

            const sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
            };

            for (const [folder, sz] of Object.entries(sizes)) {
              const dir = path.join("app/src/main/res", folder);
              fs.mkdirSync(dir, { recursive: true });
              const png = makePBRepotPng(sz);
              fs.writeFileSync(path.join(dir, "ic_launcher.png"), png);
              fs.writeFileSync(path.join(dir, "ic_launcher_round.png"), png);
            }
          '

          printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"true\"\n        android:usesCleartextTraffic=\"true\"\n        android:theme=\"@android:style/Theme.DeviceDefault.Light.NoActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml
          printf "package org.pbrepot.app;\n\nimport android.app.Activity;\nimport android.graphics.Color;\nimport android.os.Bundle;\nimport android.webkit.WebChromeClient;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\npublic class MainActivity extends Activity {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        WebView webView = new WebView(this);\n        webView.setBackgroundColor(Color.WHITE);\n        WebSettings settings = webView.getSettings();\n        settings.setJavaScriptEnabled(true);\n        settings.setDomStorageEnabled(true);\n        settings.setDatabaseEnabled(true);\n        settings.setLoadWithOverviewMode(true);\n        settings.setUseWideViewPort(true);\n        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);\n        webView.setWebChromeClient(new WebChromeClient());\n        webView.setWebViewClient(new WebViewClient());\n        setContentView(webView);\n        webView.loadUrl(\"https://pbrepot.ai.studio/\");\n    }\n}\n" > app/src/main/java/org/pbrepot/app/MainActivity.java
          rm -rf /opt/gradle/gradle-8.4 gradle.zip
          mkdir -p /opt/gradle
          curl -fsSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          rm -f gradle.zip
          chmod +x /opt/gradle/gradle-8.4/bin/gradle
          /opt/gradle/gradle-8.4/bin/gradle assembleRelease --no-daemon

      - name: Muat Naik Fail APK PB-Repot sebagai Artifact
        uses: actions/upload-artifact@v5
        with:
          name: PB-Repot-Android-APK
          path: pbrepot-project/**/*.apk
