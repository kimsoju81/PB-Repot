name: Bina PBRepot TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Sediakan Keystore Tandatangan APK
        run: |
          set -e
          if [ -n "${{ secrets.PBREPOT_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PBREPOT_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android.keystore"
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/android.keystore" \
              -alias pbrepotkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass pbrepot123 \
              -keypass pbrepot123 \
              -dname "CN=PBRepot, OU=Development, O=PBRepot, L=Melaka, ST=Melaka, C=MY"
          fi

      - name: Cipta konfigurasi Bubblewrap & Bina APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/twa-project"
          cd "$GITHUB_WORKSPACE/twa-project"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

          bubblewrap init \
            --manifest="https://kimsoju81.github.io/PBRepot/manifest.json" \
            --directory="." \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME" \
            --signingKeyPath="$GITHUB_WORKSPACE/android.keystore" \
            --signingKeyAlias="pbrepotkey" \
            --storePassword="pbrepot123" \
            --keyPassword="pbrepot123" \
            < /dev/null || true

          if [ ! -f "twa-manifest.json" ]; then
            printf 'n\n' | bubblewrap init \
              --manifest="https://kimsoju81.github.io/PBRepot/manifest.json" \
              --directory="." \
              --jdkPath="$JAVA_HOME" \
              --androidSdkPath="$ANDROID_HOME" \
              --signingKeyPath="$GITHUB_WORKSPACE/android.keystore" \
              --signingKeyAlias="pbrepotkey" \
              --storePassword="pbrepot123" \
              --keyPassword="pbrepot123"
          fi

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          bubblewrap build --skipPwaValidation

      - name: Muat Naik Fail APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DePBDeraAndroid-APK
          path: twa-project/**/*.apk
          
